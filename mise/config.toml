# herdr が作る worktree 内の repo 設定を一括で信頼する
[settings]
trusted_config_paths = ["~/.herdr/worktrees"]

[tools]
# **ここに置くのはランタイムだけにする。**linter / formatter を global に持つと、
# 設定ファイルの無い repo でも既定値のまま完走して別の規則で書き換えてしまう。
# lint / format は各 repo の package.json 側（この repo は bun + oxlint / oxfmt）
bun = "1"
node = "24"
uv = "latest"
